name: DevSecOps CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# El workflow solo necesita leer el repositorio.
permissions:
  contents: read

env:
  APP_IMAGE: inventory-app:latest

  # Versión de kind y checksum oficial del binario Linux AMD64.
  KIND_VERSION: v0.32.0
  KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54

  # Imagen de nodo Kubernetes fijada mediante digest.
  KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

jobs:
  devsecops-pipeline:
    name: Build, Security, Kubernetes and DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURAR JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ============================================================
      # 3. BUILD, PRUEBAS Y COBERTURA
      # ============================================================

      - name: Build, run tests and generate coverage
        run: |
          mvn -B clean verify

          test -f target/inventory-app.jar
          test -f target/site/jacoco/jacoco.xml

      # ============================================================
      # 4. PREPARAR EVIDENCIAS
      # ============================================================

      - name: Prepare build evidence
        run: |
          mkdir -p evidence

          cp target/inventory-app.jar \
            evidence/inventory-app.jar

          if [ -d target/surefire-reports ]; then
            cp -r target/surefire-reports \
              evidence/surefire-reports
          fi

          if [ -d target/site/jacoco ]; then
            cp -r target/site/jacoco \
              evidence/jacoco
          fi

          {
            echo "Build completed successfully"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_NUMBER}"
          } > evidence/build-status.txt

      # ============================================================
      # 5. INTEGRIDAD DEL ARTEFACTO JAR
      # ============================================================

      - name: Generate and verify JAR SHA-256
        run: |
          sha256sum target/inventory-app.jar \
            | tee evidence/artifact-sha256.txt

          sha256sum --check \
            evidence/artifact-sha256.txt \
            | tee evidence/integrity-verification.txt

      # ============================================================
      # 6. SAST CON SONARQUBE CLOUD
      # ============================================================

      # continue-on-error permite que Docker, Kubernetes y ZAP se
      # ejecuten aunque el Quality Gate todavía esté en rojo.
      # Cuando el Quality Gate pase, este paso aparecerá en verde.
      - name: SonarQube SAST and Quality Gate
        id: sonarqube
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail

          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=juangallardo-rgb \
            -Dsonar.projectKey=Juangallardo-rgb_ProyectoFinal \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            2>&1 | tee evidence/sonarqube-output.txt

      - name: Save SonarQube evidence
        if: always()
        run: |
          mkdir -p evidence

          {
            echo "SonarQube step outcome: ${{ steps.sonarqube.outcome }}"
            echo "Coverage report: target/site/jacoco/jacoco.xml"
            echo "Project key: Juangallardo-rgb_ProyectoFinal"
          } > evidence/sonarqube-status.txt

          if [ -f target/sonar/report-task.txt ]; then
            cp target/sonar/report-task.txt \
              evidence/sonarqube-report-task.txt
          fi

      # ============================================================
      # 7. CONSTRUIR LA IMAGEN DOCKER
      # ============================================================

      - name: Build Docker image
        run: |
          set -o pipefail

          docker build \
            --tag "${APP_IMAGE}" \
            . 2>&1 | tee evidence/docker-build.txt

          docker image inspect "${APP_IMAGE}" \
            > evidence/docker-image-inspect.json

          docker images inventory-app \
            | tee evidence/docker-image-list.txt

      # ============================================================
      # 8. INSTALAR KIND DE FORMA SEGURA
      # ============================================================

      - name: Download and verify kind
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"

          echo "${KIND_SHA256}  kind" \
            | sha256sum --check \
            | tee evidence/kind-integrity-verification.txt

          sudo install \
            --mode 0755 \
            kind \
            /usr/local/bin/kind

          kind version \
            | tee evidence/kind-version.txt

      # ============================================================
      # 9. CREAR EL CLÚSTER KUBERNETES
      # ============================================================

      - name: Create Kubernetes cluster
        run: |
          set -o pipefail

          kind create cluster \
            --name devsecops \
            --image "${KIND_NODE_IMAGE}" \
            --wait 120s \
            2>&1 | tee evidence/kind-cluster-creation.txt

          kind get clusters \
            | tee evidence/kind-clusters.txt

          kubectl cluster-info \
            | tee evidence/kubernetes-cluster-info.txt

          kubectl get nodes -o wide \
            | tee evidence/kubernetes-nodes.txt

      # ============================================================
      # 10. CARGAR LA IMAGEN DOCKER EN KIND
      # ============================================================

      - name: Load Docker image into Kubernetes
        run: |
          set -o pipefail

          kind load docker-image \
            "${APP_IMAGE}" \
            --name devsecops \
            2>&1 | tee evidence/kind-image-load.txt

      # ============================================================
      # 11. DESPLEGAR LA APLICACIÓN EN KUBERNETES
      # ============================================================

      - name: Deploy application to Kubernetes
        run: |
          set -o pipefail

          kubectl apply \
            -f k8s/inventory.yaml \
            | tee evidence/kubernetes-apply.txt

          kubectl rollout status \
            deployment/inventory-deployment \
            --timeout=120s \
            | tee evidence/kubernetes-rollout.txt

          kubectl get pods -o wide \
            | tee evidence/kubernetes-pods.txt

          kubectl get deployments,services -o wide \
            | tee evidence/kubernetes-resources.txt

          kubectl describe deployment inventory-deployment \
            > evidence/kubernetes-deployment-description.txt

          kubectl describe service inventory-service \
            > evidence/kubernetes-service-description.txt

      # ============================================================
      # 12. PORT-FORWARD PARA PROBAR LA APLICACIÓN
      # ============================================================

      - name: Start Kubernetes port forwarding
        run: |
          nohup kubectl port-forward \
            service/inventory-service \
            8080:8080 \
            > evidence/port-forward.txt 2>&1 &

          PORT_FORWARD_PID=$!

          echo "${PORT_FORWARD_PID}" \
            > evidence/port-forward-process.txt

          APPLICATION_READY=false

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health; then

              APPLICATION_READY=true
              echo ""
              echo "Application is available"
              break
            fi

            echo "Waiting for application. Attempt ${attempt}/30"
            sleep 2
          done

          if [ "${APPLICATION_READY}" != "true" ]; then
            echo "The application did not become available."
            cat evidence/port-forward.txt || true
            kubectl get pods -o wide || true
            kubectl logs deployment/inventory-deployment || true
            exit 1
          fi

      # ============================================================
      # 13. VALIDAR LOS ENDPOINTS
      # ============================================================

      - name: Test deployed application
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/ \
            | tee evidence/root-response.json

          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/health \
            | tee evidence/health-response.json

          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/products \
            | tee evidence/products-response.json

          echo ""

      # ============================================================
      # 14. DAST CON OWASP ZAP
      # ============================================================

      - name: OWASP ZAP DAST analysis
        run: |
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"

          # El usuario interno de la imagen ZAP utiliza UID 1000.
          # Se asigna temporalmente la carpeta sin utilizar chmod 777.
          sudo chown -R 1000:1000 evidence
          sudo chmod -R u+rwX,go-rwx evidence

          set +e

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/evidence:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -m 1 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I \
            > /tmp/zap-console-output.txt 2>&1

          ZAP_EXIT_CODE=$?

          set -e

          # Devolver la propiedad de los archivos al runner.
          sudo chown -R "${RUNNER_UID}:${RUNNER_GID}" evidence
          sudo chmod -R u+rwX,go-rwx evidence

          cp /tmp/zap-console-output.txt \
            evidence/zap-console-output.txt

          echo "OWASP ZAP exit code: ${ZAP_EXIT_CODE}" \
            | tee evidence/zap-exit-code.txt

          # Confirmar que ZAP produjo los tres reportes.
          test -s evidence/zap-report.html
          test -s evidence/zap-report.json
          test -s evidence/zap-report.md

          echo "OWASP ZAP reports generated successfully"

      # ============================================================
      # 15. CREAR RESUMEN DE TODAS LAS EVIDENCIAS
      # ============================================================

      - name: Create pipeline evidence summary
        if: always()
        run: |
          mkdir -p evidence

          cat > evidence/README-EVIDENCIAS.md <<EOF
          # Evidencias del pipeline DevSecOps

          ## Información general

          - Repositorio: ${GITHUB_REPOSITORY}
          - Rama: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Ejecución: ${GITHUB_RUN_NUMBER}
          - SonarQube: ${{ steps.sonarqube.outcome }}

          ## Procesos implementados

          1. Compilación con Maven.
          2. Pruebas unitarias con JUnit.
          3. Cobertura de pruebas con JaCoCo.
          4. Generación del artefacto JAR.
          5. Verificación del JAR mediante SHA-256.
          6. Análisis SAST con SonarQube Cloud.
          7. Construcción de imagen Docker.
          8. Verificación del binario de kind mediante SHA-256.
          9. Creación de clúster Kubernetes con kind.
          10. Despliegue de la aplicación en Kubernetes.
          11. Validación de endpoints HTTP.
          12. Análisis DAST con OWASP ZAP.

          ## Reportes principales

          - inventory-app.jar
          - integrity-verification.txt
          - jacoco/index.html
          - sonarqube-output.txt
          - docker-build.txt
          - kubernetes-pods.txt
          - kubernetes-resources.txt
          - health-response.json
          - zap-report.html
          - zap-report.json
          - zap-report.md
          EOF

          find evidence \
            -maxdepth 3 \
            -type f \
            | sort \
            | tee evidence/evidence-file-list.txt

      # ============================================================
      # 16. PUBLICAR EL JAR
      # ============================================================

      - name: Upload application JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-inventario-jar
          path: target/inventory-app.jar
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 17. PUBLICAR TODAS LAS EVIDENCIAS
      # ============================================================

      - name: Upload DevSecOps evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-devsecops
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 18. LIMPIEZA
      # ============================================================

      - name: Clean temporary resources
        if: always()
        run: |
          docker rm --force zap-scan 2>/dev/null || true
          kind delete cluster --name devsecops || true
