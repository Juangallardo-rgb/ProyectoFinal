version: 2.1

jobs:
  compilar_maven:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Verificar estructura del proyecto
          command: |
            echo "Archivos del proyecto:"
            ls -la
            echo "Version de Java:"
            java -version
            echo "Version de Maven:"
            mvn -version

      - run:
          name: Descargar dependencias y compilar con Maven
          command: |
            mvn clean compile

      - run:
          name: Ejecutar pruebas con Maven
          command: |
            mvn test

workflows:
  pipeline_maven_basico:
    jobs:
      - compilar_maven