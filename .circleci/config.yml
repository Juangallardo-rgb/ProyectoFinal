version: 2.1

jobs:
  verificar_entorno:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Verificar archivos y herramientas
          command: |
            echo "Verificando estructura del proyecto"
            ls -la

            echo "Verificando version de Java"
            java -version

            echo "Verificando version de Maven"
            mvn -version

  compilar_proyecto:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Compilar proyecto con Maven
          command: |
            mvn clean compile

  ejecutar_pruebas_paralelas:
    docker:
      - image: cimg/openjdk:17.0
    parallelism: 2
    steps:
      - checkout

      - run:
          name: Buscar y dividir pruebas entre contenedores
          command: |
            echo "Buscando archivos de prueba Java..."
            mkdir -p test-results

            TESTFILES=$(circleci tests glob "src/test/java/**/*Test.java" | circleci tests split --split-by=timings)

            echo "Pruebas asignadas a este contenedor:"
            echo "$TESTFILES"

            if [ -z "$TESTFILES" ]; then
              echo "No se encontraron pruebas específicas para dividir."
              echo "Ejecutando mvn test completo."
              mvn test
            else
              TEST_CLASSES=$(echo "$TESTFILES" | sed 's|src/test/java/||g' | sed 's|.java||g' | tr '/' '.' | paste -sd, -)

              echo "Clases de prueba que ejecutara Maven:"
              echo "$TEST_CLASSES"

              mvn test -Dtest="$TEST_CLASSES"
            fi

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports
          destination: resultados-pruebas

  validar_checkstyle:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Validar estilo de codigo con Checkstyle
          command: |
            mvn checkstyle:check

  notificar_estado_pipeline:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Notificacion de exito
          when: on_success
          command: |
            echo "======================================"
            echo "PIPELINE EXITOSO"
            echo "El proyecto ProyectoFinal compilo correctamente."
            echo "Las pruebas se ejecutaron correctamente."
            echo "La validacion Checkstyle finalizo sin errores."
            echo "Estado: SUCCESS"
            echo "======================================"

      - run:
          name: Notificacion de error
          when: on_fail
          command: |
            echo "======================================"
            echo "PIPELINE FALLIDO"
            echo "Uno de los jobs anteriores presento errores."
            echo "Revisar compilacion, pruebas o Checkstyle."
            echo "Estado: FAILED"
            echo "======================================"

      - run:
          name: Notificacion final siempre ejecutada
          when: always
          command: |
            echo "======================================"
            echo "ACCION POST PIPELINE"
            echo "Este paso se ejecuta siempre al finalizar el pipeline."
            echo "Sirve como evidencia de accion posterior."
            echo "======================================"

workflows:
  pipeline_java_maven:
    jobs:
      - verificar_entorno

      - compilar_proyecto:
          requires:
            - verificar_entorno

      - ejecutar_pruebas_paralelas:
          requires:
            - compilar_proyecto

      - validar_checkstyle:
          requires:
            - compilar_proyecto

      - notificar_estado_pipeline:
          requires:
            - ejecutar_pruebas_paralelas
            - validar_checkstyle