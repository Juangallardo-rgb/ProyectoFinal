version: 2.1

executors:
  java:
    docker:
      - image: cimg/openjdk:17.0

commands:
  restore_maven_cache:
    steps:
      - restore_cache:
          keys:
            - maven-{{ checksum "pom.xml" }}
            - maven-

  save_maven_cache:
    steps:
      - save_cache:
          key: maven-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2

  notify_success:
    steps:
      - run:
          name: Notificacion exito
          when: on_success
          command: echo "SUCCESS - $CIRCLE_WORKFLOW_JOB - Rama $CIRCLE_BRANCH"

  notify_fail:
    steps:
      - run:
          name: Notificacion error
          when: on_fail
          command: echo "FAILED - $CIRCLE_WORKFLOW_JOB - Rama $CIRCLE_BRANCH"

jobs:
  verificar_entorno:
    executor: java
    steps:
      - checkout
      - run: java -version
      - run: mvn -version
      - notify_success
      - notify_fail

  compilar_proyecto:
    executor: java
    steps:
      - checkout
      - restore_maven_cache
      - run: mvn clean compile
      - save_maven_cache
      - notify_success
      - notify_fail

  ejecutar_pruebas_paralelas:
    executor: java
    parallelism: 2
    steps:
      - checkout
      - restore_maven_cache
      - run:
          name: Ejecutar pruebas en paralelo
          command: |
            TESTFILES=$(circleci tests glob "src/test/java/**/*Test.java" | circleci tests split --split-by=timings)

            if [ -z "$TESTFILES" ]; then
              mvn test
            else
              TEST_CLASSES=$(echo "$TESTFILES" | sed 's|src/test/java/||g' | sed 's|.java||g' | tr '/' '.' | paste -sd, -)
              mvn test -Dtest="$TEST_CLASSES"
            fi
      - store_test_results:
          path: target/surefire-reports
      - store_artifacts:
          path: target/surefire-reports
          destination: resultados-pruebas
      - notify_success
      - notify_fail

  validar_checkstyle:
    executor: java
    steps:
      - checkout
      - restore_maven_cache
      - run: mvn checkstyle:check
      - notify_success
      - notify_fail

  notificar_pipeline:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "PIPELINE OK - $CIRCLE_BRANCH"

workflows:
  pipeline_desarrollo:
    jobs:
      - verificar_entorno:
          filters:
            branches:
              only: desarrollo

      - compilar_proyecto:
          requires:
            - verificar_entorno
          filters:
            branches:
              only: desarrollo

      - ejecutar_pruebas_paralelas:
          requires:
            - compilar_proyecto
          filters:
            branches:
              only: desarrollo

      - validar_checkstyle:
          requires:
            - compilar_proyecto
          filters:
            branches:
              only: desarrollo

      - notificar_pipeline:
          requires:
            - ejecutar_pruebas_paralelas
            - validar_checkstyle
          filters:
            branches:
              only: desarrollo

  pipeline_main:
    jobs:
      - verificar_entorno:
          filters:
            branches:
              only: main

      - compilar_proyecto:
          requires:
            - verificar_entorno
          filters:
            branches:
              only: main

      - ejecutar_pruebas_paralelas:
          requires:
            - compilar_proyecto
          filters:
            branches:
              only: main

      - validar_checkstyle:
          requires:
            - compilar_proyecto
          filters:
            branches:
              only: main

      - notificar_pipeline:
          requires:
            - ejecutar_pruebas_paralelas
            - validar_checkstyle
          filters:
            branches:
              only: main