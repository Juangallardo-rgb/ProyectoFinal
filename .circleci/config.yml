version: 2.1

jobs:
  verificar_entorno:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Verificar archivos y herramientas
          command: |
            echo "Verificando estructura del proyecto"
            ls -la

            echo "Verificando version de Java"
            java -version

            echo "Verificando version de Maven"
            mvn -version

  compilar_proyecto:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Compilar proyecto con Maven
          command: |
            mvn clean compile

  ejecutar_pruebas:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Ejecutar pruebas unitarias
          command: |
            mvn test

  validar_checkstyle:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout

      - run:
          name: Validar estilo de codigo con Checkstyle
          command: |
            mvn checkstyle:check

workflows:
  pipeline_java_maven:
    jobs:
      - verificar_entorno

      - compilar_proyecto:
          requires:
            - verificar_entorno

      - ejecutar_pruebas:
          requires:
            - compilar_proyecto

      - validar_checkstyle:
          requires:
            - compilar_proyecto